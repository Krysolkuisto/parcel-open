# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && cd app && xcodegen && open ParcelOpen.xcodeproj
# Then select the ParcelOpen scheme and set your Team under Signing & Capabilities
# (needed for the App Group that shares settings between the app and the widget).
name: ParcelOpen

options:
  bundleIdPrefix: com.krysolkuisto
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  # The local Swift package in this folder (Package.swift): ParcelKit + ParcelWidget.
  ParcelPackage:
    path: .

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Sets the App Group code path in ParcelKit (shared settings between app and widget).
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_GROUP"

targets:
  ParcelOpen:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/ParcelOpen
    dependencies:
      - package: ParcelPackage
        product: ParcelKit
      - target: ParcelWidgetExtension
    info:
      path: Resources/App-Info.plist
      properties:
        CFBundleDisplayName: Parcel Open
        CFBundleLocalizations: [en, fr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Lets the app reach a backend on your local network over plain HTTP. Use HTTPS for anything else.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Resources/ParcelOpen.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.krysolkuisto.parcelopen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krysolkuisto.parcelopen
        PRODUCT_NAME: Parcel Open
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"

  ParcelWidgetExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extension
    dependencies:
      - package: ParcelPackage
        product: ParcelKit
      - package: ParcelPackage
        product: ParcelWidget
    info:
      path: Resources/Widget-Info.plist
      properties:
        CFBundleDisplayName: Parcel Open
        CFBundleLocalizations: [en, fr]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Resources/ParcelWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.com.krysolkuisto.parcelopen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krysolkuisto.parcelopen.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
